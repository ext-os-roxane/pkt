[package]
name = "pkt"
description = "ExtOS package and repository engine — fetcher, CAS manager, P2P swarm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/extos-os"
authors = ["ExtOS Contributors"]

[[bin]]
name = "pkt"
path = "src/main.rs"

[dependencies]
libextos = { path = "../libextos" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
